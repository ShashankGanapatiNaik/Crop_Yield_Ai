name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements.txt\nbackend/requirements.txt" }
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (builds a tiny model via ml.src.quick_train, then runs pytest)
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images (model artifacts are generated in the next step so the backend image can build)
        run: |
          pip install -r requirements.txt
          python -m ml.src.quick_train --out ml/artifacts
          docker compose build
